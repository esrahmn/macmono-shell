
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 2000
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 5
    brightness = 0.55
    contrast = 1.0
    vibrancy = 0.0
    noise = 0.012
    color = rgba(10, 10, 10, 1.0)
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.6)
    font_size = 12
    font_family = Inter
    position = 28, -20
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:15000] w="$(nmcli -t -f ACTIVE,SSID dev wifi 2>/dev/null | sed -n 's/^yes://p' | head -1)"; c="$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)"; s="$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1)"; o="$w"; if [ -n "$c" ]; then b="$c%"; [ "$s" = Charging ] && b="$b  Charging"; o="${o:+$o      }$b"; fi; echo "$o"
    color = rgba(255, 255, 255, 0.6)
    font_size = 12
    font_family = Inter
    position = -28, -20
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = Inter
    position = 0, -96
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

label {
    monitor =
    text = <span font_weight='700'>$TIME</span>
    color = rgba(255, 255, 255, 0.95)
    font_size = 108
    font_family = Inter
    position = 0, -126
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.30)
}

shape {
    monitor =
    size = 400, 124
    rounding = 28
    color = rgba(255, 255, 255, 0.07)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.14)
    position = 0, 440
    halign = center
    valign = bottom
}

image {
    monitor =
    path = @ART@
    size = 92
    rounding = 16
    border_size = 1
    border_color = rgba(255, 255, 255, 0.18)
    reload_time = 5
    reload_cmd = bash @HERE@/music.sh art
    position = -138, 456
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] bash @HERE@/music.sh title
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = Inter
    position = 54, 518
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] bash @HERE@/music.sh artist
    color = rgba(255, 255, 255, 0.62)
    font_size = 13
    font_family = Inter
    position = 54, 496
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] bash @HERE@/music.sh bar
    color = rgba(255, 255, 255, 0.7)
    font_size = 11
    font_family = Inter
    position = 54, 466
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 400, 264
    rounding = 32
    color = rgba(255, 255, 255, 0.07)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.14)
    position = 0, 162
    halign = center
    valign = bottom
}

image {
    monitor =
    path = ~/.face
    size = 96
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.35)
    position = 0, 302
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 96, 96
    rounding = -1
    color = rgba(255, 255, 255, 0.16)
    border_size = 2
    border_color = rgba(255, 255, 255, 0.35)
    position = 0, 302
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:0] printf '%s' "${USER:0:1}" | tr '[:lower:]' '[:upper:]'
    color = rgba(255, 255, 255, 0.95)
    font_size = 38
    font_family = Inter
    position = 0, 328
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:0] n="$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1)"; echo "<span font_weight='600'>${n:-$USER}</span>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 18
    font_family = Inter
    position = 0, 266
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 0
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(255, 255, 255, 0.16)
    outer_color = rgba(255, 255, 255, 0.0)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = Inter
    check_color = rgba(255, 255, 255, 0.28)
    fail_color = rgba(255, 255, 255, 0.40)
    capslock_color = rgba(255, 255, 255, 0.24)
    fade_on_empty = false
    placeholder_text = Enter password
    check_text = Checking…
    fail_text = Wrong password ($ATTEMPTS)
    position = 0, 198
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] grep -q 1 /sys/class/leds/*capslock/brightness 2>/dev/null && echo "Caps Lock is on"
    color = rgba(255, 255, 255, 0.7)
    font_size = 11
    font_family = Inter
    position = 0, 172
    halign = center
    valign = bottom
}
