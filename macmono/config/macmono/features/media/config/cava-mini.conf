[general]
framerate = 24
# Keep in sync with `bars` in MediaVisualizerService.qml (frames with another count are dropped).
bars = 24
autosens = 1
# Seconds of silence before cava stops computing and drawing (0 = never).
sleep_timer = 5

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
