# macmono lock screen: monochrome, ala macOS
#
# Ini TEMPLATE. Sys.lock() bikin salinan di ~/.local/state/macmono/hyprlock.conf dengan:
#   - baris bertanda BG     -> wallpaper macmono (versi abu-abu kalau mode Monochrome nyala)
#   - baris bertanda AVATAR -> foto akun (/var/lib/AccountsService/icons/$USER atau ~/.face)
#   - blok avatar/inisial dipilih otomatis tergantung ada foto atau nggak
# File ini tetap valid kalau dipakai langsung: hyprlock -c <file ini>

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

background {
    monitor =
    path = screenshot   # @BG@
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    contrast = 0.95
    vibrancy = 0.0
    noise = 0.01
    color = rgba(10, 10, 10, 1.0)
}

# ------------------------------------------------------------ atas: tanggal + jam
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = Inter
    position = 0, -86
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='700'>$(date +%H:%M)</span>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 108
    font_family = Inter
    position = 0, -116
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.30)
}

# ------------------------------------------------------------ bawah: avatar, nama, password
#avatar-begin
image {
    monitor =
    path = ~/.face   # @AVATAR@
    size = 76
    rounding = -1
    border_size = 0
    position = 0, 218
    halign = center
    valign = bottom
}
#avatar-end

#initials-begin
shape {
    monitor =
    size = 76, 76
    rounding = -1
    color = rgba(255, 255, 255, 0.16)
    border_size = 0
    position = 0, 218
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:0] printf '%s' "${USER:0:1}" | tr '[:lower:]' '[:upper:]'
    color = rgba(255, 255, 255, 0.95)
    font_size = 30
    font_family = Inter
    position = 0, 238
    halign = center
    valign = bottom
}
#initials-end

label {
    monitor =
    text = cmd[update:0] n="$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1)"; echo "<span font_weight='600'>${n:-$USER}</span>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 15
    font_family = Inter
    position = 0, 180
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)
}

input-field {
    monitor =
    size = 240, 38
    outline_thickness = 0
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(255, 255, 255, 0.16)
    outer_color = rgba(255, 255, 255, 0.0)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = Inter
    check_color = rgba(255, 255, 255, 0.28)
    fail_color = rgba(255, 255, 255, 0.40)
    capslock_color = rgba(255, 255, 255, 0.24)
    fade_on_empty = false
    placeholder_text = Enter password
    check_text = Checking…
    fail_text = Wrong password
    position = 0, 128
    halign = center
    valign = bottom
}

# ------------------------------------------------------------ info kecil di bawah
label { # lagu yang lagi diputar
    monitor =
    text = cmd[update:2000] t="$(playerctl metadata title 2>/dev/null)"; a="$(playerctl metadata artist 2>/dev/null)"; [ -n "$t" ] && echo "♪  $t${a:+  —  $a}"
    color = rgba(255, 255, 255, 0.6)
    font_size = 11
    font_family = Inter
    position = 0, 44
    halign = center
    valign = bottom
}

label { # baterai + layout keyboard
    monitor =
    text = cmd[update:30000] c="$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)"; [ -n "$c" ] && echo "Battery $c%"
    color = rgba(255, 255, 255, 0.55)
    font_size = 11
    font_family = Inter
    position = -28, 24
    halign = right
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.55)
    font_size = 11
    font_family = Inter
    position = 28, 24
    halign = left
    valign = bottom
}
