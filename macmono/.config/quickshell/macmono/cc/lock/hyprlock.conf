# macmono lock screen v4: monochrome, ala macOS (versi ringan)
#
# Ini TEMPLATE. lock.sh bikin salinan di ~/.local/state/macmono/hyprlock.conf dengan:
#   - baris bertanda BG     -> wallpaper macmono yang udah di-bake (resize + blur + gelap) ke JPG
#   - baris bertanda BLUR / BRIGHT / NOISE -> dimatiin kalau wallpaper udah di-bake
#     (kalau fallback ke screenshot, blur realtime tetap dipakai)
#   - baris bertanda AVATAR -> foto akun (/var/lib/AccountsService/icons/$USER atau ~/.face)
#   - blok avatar/inisial dipilih otomatis tergantung ada foto atau nggak
#   - blok media dibuang kalau nggak ada player MPRIS yang jalan pas lock
#   - token HERE, STATE, ART diganti path folder lock/, ~/.local/state/macmono, cover lagu
#   - kalau monitor > 1, "monitor =" di semua widget diisi monitor yang lagi fokus
# File ini butuh lock.sh buat jalan (ada token yang harus diganti), jadi lewat lock.sh aja.
#
# Yang berubah dari v3 (biar nggak berat):
#   - immediate_render: widget langsung digambar, nggak nunggu gambar selesai di-load
#   - jam pakai $TIME bawaan hyprlock (nggak spawn `date` tiap detik)
#   - polling dikurangin: caps lock 250ms -> 1s, progress 1s -> 2s, judul/artis 2s -> 5s,
#     reload cover 2s -> 5s

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 2000
}

background {
    monitor =
    path = screenshot   # @BG@
    blur_passes = 2     # @BLUR@
    blur_size = 5
    brightness = 0.55   # @BRIGHT@
    contrast = 1.0
    vibrancy = 0.0
    noise = 0.012       # @NOISE@
    color = rgba(10, 10, 10, 1.0)
}

# ------------------------------------------------------------ menu bar kecil di atas
label { # layout keyboard
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.6)
    font_size = 12
    font_family = Inter
    position = 28, -20
    halign = left
    valign = top
}

label { # wifi + baterai
    monitor =
    text = cmd[update:15000] w="$(nmcli -t -f ACTIVE,SSID dev wifi 2>/dev/null | sed -n 's/^yes://p' | head -1)"; c="$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)"; s="$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1)"; o="$w"; if [ -n "$c" ]; then b="$c%"; [ "$s" = Charging ] && b="$b  Charging"; o="${o:+$o      }$b"; fi; echo "$o"
    color = rgba(255, 255, 255, 0.6)
    font_size = 12
    font_family = Inter
    position = -28, -20
    halign = right
    valign = top
}

# ------------------------------------------------------------ tanggal + jam
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = Inter
    position = 0, -96
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

label {
    monitor =
    text = <span font_weight='700'>$TIME</span>
    color = rgba(255, 255, 255, 0.95)
    font_size = 108
    font_family = Inter
    position = 0, -126
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.30)
}

# ------------------------------------------------------------ media card (cover + lagu)
# Posisi x = 0 itu tengah layar. Cover di kiri (-138), teks di tengah area kanan card (+54).
#media-begin
shape {
    monitor =
    size = 400, 124
    rounding = 28
    color = rgba(255, 255, 255, 0.07)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.14)
    position = 0, 440
    halign = center
    valign = bottom
}

image { # cover album: awalnya cover yang udah ke-cache (lock.sh), lalu di-refresh tiap 5 detik
    monitor =
    path = @ART@
    size = 92
    rounding = 16
    border_size = 1
    border_color = rgba(255, 255, 255, 0.18)
    reload_time = 5
    reload_cmd = bash @HERE@/music.sh art
    position = -138, 456
    halign = center
    valign = bottom
}

label { # judul
    monitor =
    text = cmd[update:5000] bash @HERE@/music.sh title
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = Inter
    position = 54, 518
    halign = center
    valign = bottom
}

label { # artis
    monitor =
    text = cmd[update:5000] bash @HERE@/music.sh artist
    color = rgba(255, 255, 255, 0.62)
    font_size = 13
    font_family = Inter
    position = 54, 496
    halign = center
    valign = bottom
}

label { # progress: 1:23  ━━━●───  3:45
    monitor =
    text = cmd[update:2000] bash @HERE@/music.sh bar
    color = rgba(255, 255, 255, 0.7)
    font_size = 11
    font_family = Inter
    position = 54, 466
    halign = center
    valign = bottom
}
#media-end

# ------------------------------------------------------------ card login
shape {
    monitor =
    size = 400, 264
    rounding = 32
    color = rgba(255, 255, 255, 0.07)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.14)
    position = 0, 162
    halign = center
    valign = bottom
}

#avatar-begin
image {
    monitor =
    path = ~/.face   # @AVATAR@
    size = 96
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.35)
    position = 0, 302
    halign = center
    valign = bottom
}
#avatar-end

#initials-begin
shape {
    monitor =
    size = 96, 96
    rounding = -1
    color = rgba(255, 255, 255, 0.16)
    border_size = 2
    border_color = rgba(255, 255, 255, 0.35)
    position = 0, 302
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:0] printf '%s' "${USER:0:1}" | tr '[:lower:]' '[:upper:]'
    color = rgba(255, 255, 255, 0.95)
    font_size = 38
    font_family = Inter
    position = 0, 328
    halign = center
    valign = bottom
}
#initials-end

label {
    monitor =
    text = cmd[update:0] n="$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1)"; echo "<span font_weight='600'>${n:-$USER}</span>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 18
    font_family = Inter
    position = 0, 266
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 0
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(255, 255, 255, 0.16)
    outer_color = rgba(255, 255, 255, 0.0)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = Inter
    check_color = rgba(255, 255, 255, 0.28)
    fail_color = rgba(255, 255, 255, 0.40)
    capslock_color = rgba(255, 255, 255, 0.24)
    fade_on_empty = false
    placeholder_text = Enter password
    check_text = Checking…
    fail_text = Wrong password ($ATTEMPTS)
    position = 0, 198
    halign = center
    valign = bottom
}

label { # peringatan Caps Lock, muncul di bawah input
    monitor =
    text = cmd[update:1000] grep -q 1 /sys/class/leds/*capslock/brightness 2>/dev/null && echo "Caps Lock is on"
    color = rgba(255, 255, 255, 0.7)
    font_size = 11
    font_family = Inter
    position = 0, 172
    halign = center
    valign = bottom
}
