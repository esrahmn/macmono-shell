# Kunci layar langsung lewat lock.sh (sudah ada guard `pidof hyprlock`), tanpa bergantung pada qs yang hidup.
# Wallpaper dan mode mono dibaca lock.sh dari ~/.local/state/macmono kalau tanpa argumen.
$lock_cmd = bash ~/.config/quickshell/macmono/lock/lock.sh
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
